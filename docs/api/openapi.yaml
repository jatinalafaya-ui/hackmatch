openapi: 3.0.3
info:
  title: HackMatch API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    REST API behind the HackMatch web (React) and mobile (Flutter) apps.
    This SwaggerHub document covers the two endpoints shown in the demo:
    logging in to get a JWT, and the server-side partial-match search.
servers:
  - url: https://{host}/api
    variables:
      host:
        default: hackmatch.vercel.app
        description: Domain the app is deployed on
tags:
  - name: Auth
    description: Account login
  - name: Search
    description: Server-side attendee search
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a JWT
      security: []
      description: Only accounts whose email has been verified can log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jatin.demo@example.com
              password: Knights2026
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or malformed email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email or password is incorrect
        '403':
          description: Email not verified yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Verify your email before logging in
        '429':
          description: Too many attempts from this address
  /attendees/search:
    get:
      tags: [Search]
      operationId: searchAttendees
      summary: Search attendees and mentors (partial match)
      description: |
        Case-insensitive partial match on first name, last name, school, skills
        and "looking for". Every word in `q` must match somewhere, so extra
        words narrow the results. Regex characters are treated as plain text.
        Results never include email addresses or unverified accounts.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
          example: rea
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [hacker, mentor]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: One page of results (20 per page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Search text too long or unknown role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'JWT, valid for 7 days. Send it as the header "Authorization: Bearer <token>".'
        user:
          $ref: '#/components/schemas/CurrentUser'
    Attendee:
      type: object
      properties:
        id:
          type: string
          example: 6738f0c2a1b2c3d4e5f60718
        firstName:
          type: string
          example: Andrea
        lastName:
          type: string
          example: Lopez
        role:
          type: string
          enum: [hacker, mentor]
        school:
          type: string
          example: UCF
        skills:
          type: array
          items:
            type: string
          example: [React, TypeScript, Figma]
        lookingFor:
          type: string
          example: A backend dev for a fintech idea
        bio:
          type: string
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/Attendee'
        - type: object
          properties:
            email:
              type: string
              format: email
            isVerified:
              type: boolean
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attendee'
        total:
          type: integer
          example: 9
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
    Error:
      type: object
      properties:
        error:
          type: string
